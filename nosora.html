<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REVERSE12 · 노소라 고객관리</title>
<link rel="stylesheet" href="compact.css?v=20260922-2">
<style>
:root{--bg:#f7fbf8;--card:#fff;--mint:#e1f4ed;--mint2:#bedfd4;--ink:#173c36;--sub:#6b7e78;--line:#d8e7e1;--accent:#176d62;--warn:#d89027;--danger:#d65454}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f6fbf9,#fffaf0);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;padding-bottom:42px}
header{position:sticky;top:0;z-index:50;background:#f8fcfaee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:5px 7px}
.head{display:flex;align-items:center;justify-content:space-between;gap:6px}.head b{font-size:13px}.head small{display:block;color:var(--sub);font-size:8px}.head a{font-size:9px;border:1px solid var(--line);border-radius:10px;padding:5px 7px;background:#fff}
.tabs{display:flex;gap:3px;overflow:auto;padding:4px 0 0;scrollbar-width:none}.tabs button{flex:0 0 auto;min-height:28px!important;border:1px solid var(--line);background:white;border-radius:999px;padding:3px 8px!important;font-size:9px}.tabs button.active{background:var(--accent);color:#fff}
main{padding:5px}.page{display:none}.page.active{display:block}.hero{padding:7px!important;background:linear-gradient(135deg,#e2f5ee,#eef7ff);border:1px solid var(--line);border-radius:12px;margin-bottom:5px!important;display:block!important}.hero h1{font-size:18px;margin:0 0 2px!important;line-height:1.05}.hero p{font-size:9px;color:var(--sub);margin:0!important}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px}.stat b{font-size:16px;display:block}.stat span{font-size:8px;color:var(--sub)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:4px}.card h2,.card h3{margin:0 0 4px;font-size:12px;line-height:1.1}.row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}
.btn{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:5px 8px;min-height:28px!important;font-size:9px}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}
.field{display:grid;gap:2px;margin-bottom:4px}.field label{font-size:8px;color:var(--sub)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:5px 6px;min-height:30px;font-size:10px}textarea{min-height:48px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}.full{grid-column:1/-1}
.item{border:1px solid var(--line);border-radius:8px;padding:5px;margin-bottom:3px;background:#fff}.item strong{font-size:10px}.meta{font-size:8px;color:var(--sub);line-height:1.2}.badge{display:inline-block;font-size:7px;border-radius:99px;padding:2px 5px;background:var(--mint);border:1px solid var(--mint2)}.badge.warn{background:#fff0dc;border-color:#ebc38b}.badge.danger{background:#ffe5e5;border-color:#efb5b5}
.habit{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;border-bottom:1px solid #eef3f1;padding:4px 0}.habit span{font-size:9px;line-height:1.15}.habit input{width:18px;height:18px;min-height:auto}
.calhead{display:flex;align-items:center;justify-content:space-between}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:4px}.dow{text-align:center;font-size:7px;color:var(--sub)}.day{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:0!important;font-size:8px;position:relative}.day.has::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:3px}.day.today{outline:2px solid #c9aa69}.day.sel{background:var(--mint)}
.sheet{position:fixed;inset:0;background:#102c2744;display:none;align-items:flex-end;z-index:100}.sheet.open{display:flex}.sheetbox{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:14px 14px 0 0;padding:8px}
.sheetbox h3{margin:0 0 5px;font-size:12px}.entry{background:#f8fbfa;border:1px solid var(--line);border-radius:7px;padding:5px;margin:3px 0}.entry b{font-size:9px}.entry p{font-size:8px;margin:2px 0;color:var(--sub)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
<script src="shell-nav.js?v=20260922-2" defer></script>
</head>
<body>
<header><div class="head"><div><b>REVERSE12 · 노소라 고객관리</b><small>습관 · 명단 · 소비자 · 사업자 · 후속 · 달력</small></div><a href="index.html">제품몰</a></div><div class="tabs" id="tabs">
<button data-page="home" class="active">홈</button><button data-page="habit">습관</button><button data-page="leads">신규명단</button><button data-page="consumers">소비자</button><button data-page="partners">사업자</button><button data-page="follow">후속</button><button data-page="calendar">달력</button><button data-page="backup">백업</button>
</div></header>
<main>
<section class="page active" id="home"><div class="hero"><h1>12년 젊어지고 120억 모으자</h1><p>오늘 할 일을 입력하고 바로 체크하세요.</p></div><div class="stats"><div class="stat"><b id="sHabit">0/12</b><span>오늘 습관</span></div><div class="stat"><b id="sLead">0</b><span>신규명단</span></div><div class="stat"><b id="sFollow">0</b><span>후속 대상</span></div><div class="stat"><b id="sCal">0</b><span>오늘 일정</span></div></div><div class="card"><h3>빠른 입력</h3><div class="row"><button class="btn" onclick="go('leads');openLead()">+ 신규명단</button><button class="btn alt" onclick="go('calendar');openDate(today())">+ 일정</button><button class="btn alt" onclick="go('habit')">습관 체크</button></div></div><div class="card"><h3>오늘 일정</h3><div id="todayEntries"></div></div></section>

<section class="page" id="habit"><div class="card"><h2>오늘의 12가지</h2><div id="habitList"></div><div class="field"><label>오늘 메모</label><textarea id="habitMemo"></textarea></div></div></section>

<section class="page" id="leads"><div class="card"><div class="row" style="justify-content:space-between"><h2>신규 고객 명단</h2><button class="btn" onclick="openLead()">+ 추가</button></div><div class="grid2"><div class="field"><label>검색</label><input id="leadSearch" oninput="renderLeads()" placeholder="이름/전화번호"></div><div class="field"><label>분류</label><select id="leadFilter" onchange="renderLeads()"><option value="">전체</option><option>미분류</option><option>소비자</option><option>사업자</option><option>후속관리</option></select></div></div></div><div id="leadList"></div></section>

<section class="page" id="consumers"><div class="card"><div class="row" style="justify-content:space-between"><h2>소비자 관리</h2><button class="btn" onclick="openConsumer()">+ 소비자</button></div></div><div id="consumerList"></div></section>

<section class="page" id="partners"><div class="card"><div class="row" style="justify-content:space-between"><h2>사업자 관리</h2><button class="btn" onclick="openPartner()">+ 사업자</button></div></div><div id="partnerList"></div></section>

<section class="page" id="follow"><div class="card"><h2>후속관리</h2><div class="grid2"><div class="field"><label>상태</label><select id="followFilter" onchange="renderFollow()"><option value="">전체</option><option>대기</option><option>연락완료</option><option>다시연락</option><option>종료</option></select></div><div class="field"><label>날짜</label><select id="followDateFilter" onchange="renderFollow()"><option value="">전체</option><option value="today">오늘</option><option value="late">지연</option></select></div></div></div><div id="followList"></div></section>

<section class="page" id="calendar"><div class="card"><div class="calhead"><button class="btn alt" onclick="moveMonth(-1)">‹</button><h2 id="monthLabel"></h2><button class="btn alt" onclick="moveMonth(1)">›</button></div><div class="calendar" id="calendarGrid"></div></div></section>

<section class="page" id="backup"><div class="card"><h2>백업 / 복원</h2><div class="row"><button class="btn" onclick="backup()">JSON 백업</button><label class="btn alt">JSON 복원<input type="file" accept=".json" hidden onchange="restore(event)"></label><button class="btn danger" onclick="resetAll()">전체 초기화</button></div><p class="meta" id="backupInfo"></p></div></section>
</main>

<div class="sheet" id="leadSheet"><div class="sheetbox"><h3>신규 명단 입력</h3><input type="hidden" id="leadId"><div class="grid2"><div class="field"><label>이름</label><input id="leadName"></div><div class="field"><label>전화번호</label><input id="leadPhone"></div><div class="field"><label>전화일</label><input id="leadCall" type="date"></div><div class="field"><label>미팅일</label><input id="leadMeet" type="date"></div><div class="field full"><label>미팅 내용</label><textarea id="leadMeetNote"></textarea></div><div class="field"><label>24시간 후속</label><input id="leadFollowAt" type="datetime-local"></div><div class="field"><label>분류</label><select id="leadClass"><option>미분류</option><option>소비자</option><option>사업자</option><option>후속관리</option></select></div><div class="field full"><label>후속 내용</label><textarea id="leadFollowNote"></textarea></div><div class="field full"><label>소개받은 사람(쉼표)</label><input id="leadRefs"></div><div class="field full"><label>비고</label><textarea id="leadMemo"></textarea></div></div><div class="row"><button class="btn" onclick="saveLead()">저장</button><button class="btn alt" onclick="closeSheet('leadSheet')">닫기</button></div></div></div>

<div class="sheet" id="consumerSheet"><div class="sheetbox"><h3>소비자 입력</h3><input type="hidden" id="consumerId"><div class="grid2"><div class="field"><label>이름</label><input id="consumerName"></div><div class="field"><label>전화번호</label><input id="consumerPhone"></div><div class="field"><label>제품명</label><input id="consumerProduct"></div><div class="field"><label>최근 주문일</label><input id="consumerOrder" type="date"></div><div class="field"><label>반복주기</label><select id="consumerCycle"><option value="1">1개월</option><option value="2">2개월</option><option value="3">3개월</option><option value="6">6개월</option></select></div><div class="field"><label>다음 주문일</label><input id="consumerNext" type="date"></div><div class="field full"><label>메모</label><textarea id="consumerMemo"></textarea></div></div><div class="row"><button class="btn" onclick="saveConsumer()">저장</button><button class="btn alt" onclick="closeSheet('consumerSheet')">닫기</button></div></div></div>

<div class="sheet" id="partnerSheet"><div class="sheetbox"><h3>사업자 입력</h3><input type="hidden" id="partnerId"><div class="grid2"><div class="field"><label>이름</label><input id="partnerName"></div><div class="field"><label>전화번호</label><input id="partnerPhone"></div><div class="field"><label>주간 1:1 미팅 횟수</label><input id="partnerMeet" type="number" min="0"></div><div class="field"><label>오픈미팅 날짜</label><input id="partnerOpen" type="date"></div><div class="field"><label>OSR 날짜</label><input id="partnerOsr" type="date"></div><div class="field"><label>상담 날짜</label><input id="partnerConsult" type="date"></div><div class="field full"><label>이번 달 신규명단(쉼표)</label><input id="partnerNames"></div><div class="field full"><label>비고</label><textarea id="partnerMemo"></textarea></div></div><div class="row"><button class="btn" onclick="savePartner()">저장</button><button class="btn alt" onclick="closeSheet('partnerSheet')">닫기</button></div></div></div>

<div class="sheet" id="dateSheet"><div class="sheetbox"><h3 id="dateTitle">날짜 일정 입력</h3><input type="hidden" id="dateKey"><div id="dateEntries"></div><div class="grid2"><div class="field"><label>일정명</label><input id="calTitle"></div><div class="field"><label>시간</label><input id="calTime" type="time"></div><div class="field full"><label>내용</label><textarea id="calContent"></textarea></div><div class="field full"><label>메모</label><textarea id="calMemo"></textarea></div></div><div class="row"><button class="btn" onclick="saveCalendarEntry()">일정 저장</button><button class="btn alt" onclick="closeSheet('dateSheet')">닫기</button></div></div></div>

<script>
const K='r12_nosora_20260922';let db=load();let calCursor=new Date();
const habits=['기상 직후 물 500ml + 균형미네랄','아침 햇빛 보며 10분 빠르게 걷기','식후 10분 걷기 1회','식후 10분 걷기 2회','안전한 장소에서 뒤·옆 걷기','하루 10분 독서','OWNER TV/YouTube 오디오 10분','Zoom/오픈미팅/OSR 참석','하루 3번 명단 떠올려 추가','판매 제품 직접 애용','소비자 관리/주간 제품·사업 소개','스폰서 상담 + SNS 하루 1건'];
function base(){return{habits:{},leads:[],consumers:[],partners:[],follow:[],calendar:{},lastBackup:null}}function load(){try{return Object.assign(base(),JSON.parse(localStorage.getItem(K)||'{}'))}catch{return base()}}function save(){localStorage.setItem(K,JSON.stringify(db));renderAll()}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function today(){return ymd(new Date())}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function openSheet(x){document.getElementById(x).classList.add('open')}function closeSheet(x){document.getElementById(x).classList.remove('open')}
function renderHabit(){let r=db.habits[today()]||{c:Array(12).fill(false),memo:''};habitList.innerHTML=habits.map((h,i)=>'<div class="habit"><span>'+(i+1)+'. '+esc(h)+'</span><input type="checkbox" '+(r.c[i]?'checked':'')+' onchange="toggleHabit('+i+',this.checked)"></div>').join('');habitMemo.value=r.memo||'';habitMemo.onchange=e=>{let a=db.habits[today()]||{c:Array(12).fill(false)};a.memo=e.target.value;db.habits[today()]=a;save()};sHabit.textContent=(r.c||[]).filter(Boolean).length+'/12'}
function toggleHabit(i,v){let r=db.habits[today()]||{c:Array(12).fill(false),memo:''};r.c[i]=v;db.habits[today()]=r;save()}
function openLead(x){leadId.value='';leadName.value='';leadPhone.value='';leadCall.value='';leadMeet.value='';leadMeetNote.value='';leadFollowAt.value='';leadClass.value='미분류';leadFollowNote.value='';leadRefs.value='';leadMemo.value='';if(x){let a=db.leads.find(v=>v.id===x);Object.assign(leadId,{value:a.id});leadName.value=a.name;leadPhone.value=a.phone||'';leadCall.value=a.call||'';leadMeet.value=a.meet||'';leadMeetNote.value=a.meetNote||'';leadFollowAt.value=a.followAt||'';leadClass.value=a.classification||'미분류';leadFollowNote.value=a.followNote||'';leadRefs.value=(a.refs||[]).join(', ');leadMemo.value=a.memo||''}openSheet('leadSheet')}
function saveLead(){if(!leadName.value.trim())return alert('이름을 입력하세요.');let a={id:leadId.value||id(),name:leadName.value.trim(),phone:leadPhone.value.trim(),call:leadCall.value,meet:leadMeet.value,meetNote:leadMeetNote.value,followAt:leadFollowAt.value,classification:leadClass.value,followNote:leadFollowNote.value,refs:leadRefs.value.split(',').map(x=>x.trim()).filter(Boolean),memo:leadMemo.value};let i=db.leads.findIndex(v=>v.id===a.id);i<0?db.leads.unshift(a):db.leads[i]=a;sync(a);closeSheet('leadSheet');save()}
function sync(a){if(a.classification==='소비자'&&!db.consumers.some(x=>x.source===a.id))db.consumers.unshift({id:id(),source:a.id,name:a.name,phone:a.phone,product:'',order:'',cycle:1,next:'',memo:''});if(a.classification==='사업자'&&!db.partners.some(x=>x.source===a.id))db.partners.unshift({id:id(),source:a.id,name:a.name,phone:a.phone,meet:0,open:'',osr:'',consult:'',names:[],memo:''});if(a.classification==='후속관리'&&!db.follow.some(x=>x.source===a.id))db.follow.unshift({id:id(),source:a.id,name:a.name,phone:a.phone,next:a.followAt||'',note:a.followNote||'',status:'대기'})}
function renderLeads(){let q=(leadSearch.value||'').toLowerCase(),f=leadFilter.value;let a=db.leads.filter(x=>(!q||(x.name+' '+x.phone).toLowerCase().includes(q))&&(!f||x.classification===f));leadList.innerHTML=a.map(x=>'<div class="item"><div class="row" style="justify-content:space-between"><strong>'+esc(x.name)+'</strong><span class="badge">'+esc(x.classification)+'</span></div><div class="meta">'+esc(x.phone)+' · 전화 '+(x.call||'-')+' · 미팅 '+(x.meet||'-')+' · 후속 '+(x.followAt||'-')+'</div><div class="row"><button class="btn alt" onclick="openLead(\''+x.id+'\')">수정</button><button class="btn alt" onclick="delLead(\''+x.id+'\')">삭제</button></div></div>').join('')||'<div class="card meta">등록된 명단이 없습니다.</div>';sLead.textContent=db.leads.length}
function delLead(x){if(confirm('삭제할까요?')){db.leads=db.leads.filter(v=>v.id!==x);save()}}
function openConsumer(x){consumerId.value='';consumerName.value='';consumerPhone.value='';consumerProduct.value='';consumerOrder.value='';consumerCycle.value='1';consumerNext.value='';consumerMemo.value='';if(x){let a=db.consumers.find(v=>v.id===x);consumerId.value=a.id;consumerName.value=a.name;consumerPhone.value=a.phone||'';consumerProduct.value=a.product||'';consumerOrder.value=a.order||'';consumerCycle.value=a.cycle||1;consumerNext.value=a.next||'';consumerMemo.value=a.memo||''}openSheet('consumerSheet')}
function nextDate(d,m){if(!d)return'';let x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+Number(m));return ymd(x)}
function saveConsumer(){if(!consumerName.value.trim())return;let a={id:consumerId.value||id(),name:consumerName.value.trim(),phone:consumerPhone.value.trim(),product:consumerProduct.value,order:consumerOrder.value,cycle:Number(consumerCycle.value||1),next:consumerNext.value||nextDate(consumerOrder.value,consumerCycle.value),memo:consumerMemo.value};let old=db.consumers.find(x=>x.id===a.id);if(old?.source)a.source=old.source;let i=db.consumers.findIndex(v=>v.id===a.id);i<0?db.consumers.unshift(a):db.consumers[i]=a;closeSheet('consumerSheet');save()}
function renderConsumers(){consumerList.innerHTML=db.consumers.map(x=>'<div class="item"><strong>'+esc(x.name)+'</strong><div class="meta">'+esc(x.phone)+' · '+esc(x.product||'제품 미입력')+' · 다음 '+(x.next||'-')+'</div><div class="row"><button class="btn alt" onclick="openConsumer(\''+x.id+'\')">수정</button></div></div>').join('')||'<div class="card meta">소비자가 없습니다.</div>'}
function openPartner(x){partnerId.value='';partnerName.value='';partnerPhone.value='';partnerMeet.value='0';partnerOpen.value='';partnerOsr.value='';partnerConsult.value='';partnerNames.value='';partnerMemo.value='';if(x){let a=db.partners.find(v=>v.id===x);partnerId.value=a.id;partnerName.value=a.name;partnerPhone.value=a.phone||'';partnerMeet.value=a.meet||0;partnerOpen.value=a.open||'';partnerOsr.value=a.osr||'';partnerConsult.value=a.consult||'';partnerNames.value=(a.names||[]).join(', ');partnerMemo.value=a.memo||''}openSheet('partnerSheet')}
function savePartner(){if(!partnerName.value.trim())return;let a={id:partnerId.value||id(),name:partnerName.value.trim(),phone:partnerPhone.value.trim(),meet:Number(partnerMeet.value||0),open:partnerOpen.value,osr:partnerOsr.value,consult:partnerConsult.value,names:partnerNames.value.split(',').map(x=>x.trim()).filter(Boolean),memo:partnerMemo.value};let old=db.partners.find(x=>x.id===a.id);if(old?.source)a.source=old.source;let i=db.partners.findIndex(v=>v.id===a.id);i<0?db.partners.unshift(a):db.partners[i]=a;closeSheet('partnerSheet');save()}
function renderPartners(){partnerList.innerHTML=db.partners.map(x=>'<div class="item"><strong>'+esc(x.name)+'</strong><div class="meta">'+esc(x.phone)+' · 1:1 '+(x.meet||0)+'회 · 오픈 '+(x.open||'-')+' · OSR '+(x.osr||'-')+'</div><div class="row"><button class="btn alt" onclick="openPartner(\''+x.id+'\')">수정</button></div></div>').join('')||'<div class="card meta">사업자가 없습니다.</div>'}
function renderFollow(){let st=followFilter.value,df=followDateFilter.value,t=today();let a=db.follow.filter(x=>(!st||x.status===st)&&(!df||(df==='today'&&x.next.slice(0,10)===t)||(df==='late'&&x.next&&x.next.slice(0,10)<t&&x.status!=='종료')));followList.innerHTML=a.map(x=>'<div class="item"><div class="row" style="justify-content:space-between"><strong>'+esc(x.name)+'</strong><span class="badge '+(x.next&&x.next.slice(0,10)<t&&x.status!=='종료'?'danger':'')+'">'+esc(x.status)+'</span></div><div class="meta">'+esc(x.phone)+' · '+esc(x.note||'')+' · '+(x.next||'-')+'</div><select onchange="setFollow(\''+x.id+'\',this.value)"><option '+(x.status==='대기'?'selected':'')+'>대기</option><option '+(x.status==='연락완료'?'selected':'')+'>연락완료</option><option '+(x.status==='다시연락'?'selected':'')+'>다시연락</option><option '+(x.status==='종료'?'selected':'')+'>종료</option></select></div>').join('')||'<div class="card meta">후속 대상이 없습니다.</div>';sFollow.textContent=db.follow.filter(x=>x.status!=='종료').length}
function setFollow(x,v){let a=db.follow.find(z=>z.id===x);if(a){a.status=v;save()}}
function moveMonth(n){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1);renderCalendar()}
function renderCalendar(){let y=calCursor.getFullYear(),m=calCursor.getMonth();monthLabel.textContent=y+'년 '+(m+1)+'월';calendarGrid.innerHTML='';['일','월','화','수','목','금','토'].forEach(x=>calendarGrid.insertAdjacentHTML('beforeend','<div class="dow">'+x+'</div>'));let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)calendarGrid.appendChild(document.createElement('div'));for(let d=1;d<=days;d++){let k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),b=document.createElement('button');b.className='day'+((db.calendar[k]||[]).length?' has':'')+(k===today()?' today':'');b.innerHTML='<span>'+d+'</span>';b.onclick=()=>openDate(k);calendarGrid.appendChild(b)}}
function openDate(k){dateKey.value=k;dateTitle.textContent=k+' 일정 입력';calTitle.value='';calTime.value='';calContent.value='';calMemo.value='';renderDateEntries(k);openSheet('dateSheet')}
function renderDateEntries(k){let a=db.calendar[k]||[];dateEntries.innerHTML=a.map(x=>'<div class="entry"><b>'+esc(x.time||'')+' '+esc(x.title)+'</b><p>'+esc(x.content||'')+' '+esc(x.memo||'')+'</p><button class="btn alt" onclick="deleteCal(\''+k+'\',\''+x.id+'\')">삭제</button></div>').join('')}
function saveCalendarEntry(){let k=dateKey.value;if(!calTitle.value.trim())return alert('일정명을 입력하세요.');(db.calendar[k]||(db.calendar[k]=[])).push({id:id(),title:calTitle.value.trim(),time:calTime.value,content:calContent.value,memo:calMemo.value});save();renderDateEntries(k);calTitle.value='';calTime.value='';calContent.value='';calMemo.value=''}
function deleteCal(k,x){db.calendar[k]=(db.calendar[k]||[]).filter(v=>v.id!==x);save();renderDateEntries(k)}
function renderHome(){let a=db.calendar[today()]||[];todayEntries.innerHTML=a.map(x=>'<div class="item"><strong>'+esc(x.time||'')+' '+esc(x.title)+'</strong><div class="meta">'+esc(x.content||'')+'</div></div>').join('')||'<div class="meta">오늘 일정이 없습니다.</div>';sCal.textContent=a.length}
function backup(){db.lastBackup=new Date().toISOString();localStorage.setItem(K,JSON.stringify(db));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='REVERSE12_NOSORA_'+today()+'.json';a.click();renderAll()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=Object.assign(base(),JSON.parse(r.result));save()}catch{alert('백업 파일을 확인하세요.')}};r.readAsText(f)}
function resetAll(){if(confirm('전체 초기화할까요?')&&confirm('삭제 후 복구할 수 없습니다. 계속할까요?')){db=base();save()}}
function renderAll(){renderHabit();renderLeads();renderConsumers();renderPartners();renderFollow();renderCalendar();renderHome();backupInfo.textContent='마지막 백업: '+(db.lastBackup||'없음')}
consumerOrder.addEventListener('change',()=>{if(consumerOrder.value)consumerNext.value=nextDate(consumerOrder.value,consumerCycle.value)});consumerCycle.addEventListener('change',()=>{if(consumerOrder.value)consumerNext.value=nextDate(consumerOrder.value,consumerCycle.value)});
renderAll();
</script>
</body></html>
